services:
  postgres:
    image: postgres:16
    container_name: pg_practica1
    restart: always
    environment:
      POSTGRES_USER: mavv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: practica1
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: